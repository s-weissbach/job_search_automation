search:
  keywords:
    - "translational scientist"
    - "discovery scientist immunology"
    - "scientist cell biology"
    - "scientist disease biology"
    - "organoid scientist"
    - "scientist in vitro models"
    - "scientist assay development"
  locations:
    - "Switzerland"
    - "Germany"
    - "Denmark"
    - "Austria"
  sites:
    - "linkedin"
  results_per_site: 20
  # Keep each slice bounded; large repeated pulls trigger LinkedIn throttling.
  results_per_site_by_site:
    linkedin: 300
  # Avoid burst-throttling across the title/location matrix. Retry a completely
  # empty slice once after a longer pause if LinkedIn temporarily refuses it.
  search_delay_seconds: 5
  empty_retry_attempts: 1
  empty_retry_delay_seconds: 45
  hours_old: 72
  linkedin_fetch_description: true
  location_city_map:
    Basel: Switzerland
    Zurich: Switzerland
    Schlieren: Switzerland
    Geneva: Switzerland
    Lausanne: Switzerland
    Munich: Germany
    Berlin: Germany
    Heidelberg: Germany
    Copenhagen: Denmark
    Aarhus: Denmark
    Vienna: Austria

assessment:
  min_score: 70
  max_description_chars: 5000
  max_input_tokens: 3500
  # No penalty for academia, government or non-profit roles: Julia is open to
  # all sectors. The 15-point non-industry penalty is the owner's preference only.
  industry_malus: 0

prefilter:
  enabled: true
  min_relevance_score: 7
  max_llm_jobs: null
  rescore_open_jobs: true
  recall_audit_sample_size: 5
  max_description_chars: 8000
  llm_description_chars: 5000
  exclude_known_nonindustry: false
  exclude_obvious_nonindustry: false
  exclude_junior_roles: true
  exclude_management_roles: false
  exclude_explicit_seniority_mismatches: false
  extra_strong_title_patterns:
    - "translational scientist"
    - "discovery scientist"
    - "disease biology"
    - "organoid"
    - "cell biology"
    - "immunology"
  extra_domain_patterns:
    - "organoid"
    - "immunolog"
    - "cell biology"
    - "kidney|renal"
    - "lung|pulmonary"
    - "functional assay"
    - "in vitro model"
    - "flow cytometr"
    - "high-content imaging"
    - "target validation"
    - "disease mechanism"
    - "crispr"
  extra_excluded_title_patterns:
    - "computational scientist"
    - "bioinformatics scientist"
  extra_nonindustry_company_patterns: []

output:
  results_dir: "results/julia"

pharmajob_io:
  enabled: true
  base_url: "http://127.0.0.1:8000"
  freshness_marker: "/Users/stephanweissbach/Projects/pharmajob.io/.last_scrape_complete"
  freshness_max_wait_minutes: 360
  freshness_poll_seconds: 60
  keywords:
    - "scientist"
    - "immunology"
    - "organoid"
    - "cell biology"
    - "translational"
    - "assay development"
    - "disease biology"
  timeout_seconds: 15
  page_size: 100
  max_pages: 5
  max_age_days: 14

company_portals: {}
