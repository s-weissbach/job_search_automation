# Job search configuration template — copy to config.yaml and fill in your preferences
# cp config.example.yaml config.yaml

search:
  keywords:
    - "your job title"
    - "related role"
  locations:
    - "Remote"
    - "Your City, Country"
  sites:
    - "linkedin"
    - "indeed"
  results_per_site: 20
  hours_old: 72
  country_indeed: "USA"        # Change to your country: Germany, UK, etc.
  # Set true to fetch full descriptions from LinkedIn (slower but better assessments)
  linkedin_fetch_description: false
  # Optional: map bare city names to countries for Workday portals
  # location_city_map:
  #   "Basel": "Switzerland"

assessment:
  # claude-haiku-4-5: fastest and cheapest (~$0.07 per run of 50 new jobs,
  # scored via the Anthropic Message Batches API — a flat 50% off standard
  # rates; already-scored jobs are free on every later run, see score store
  # below). claude-sonnet-4-6: higher quality, same batch discount applies.
  # (Prompt caching does not add further savings under the Batches API —
  # batch requests run in parallel with no cache write-then-read ordering
  # guarantee, so cache_control on the system prompt has no effect here.)
  model: "claude-haiku-4-5"
  # Model used for the one-time CV compression step
  compression_model: "claude-sonnet-4-6"
  min_score: 60
  # Truncate job descriptions to limit tokens per assessment
  max_description_chars: 4000
  # Skip jobs whose input exceeds this token count (counted before inference, no cost).
  max_input_tokens: 3000
  # Points deducted from non-industry jobs (academia, government, nonprofit).
  # Set to 0 to disable. Use --clear-score-cache after changing this.
  industry_malus: 15
  # Optional: sectors to never send for AI evaluation. Values: industry, academia,
  # government, nonprofit, other. A company only enters the blacklist after its sector
  # has been identified once (its first posting is still scored); every later posting
  # from that same company is skipped without an API call.
  # sector_blacklist:
  #   - academia
  #   - government
  #   - nonprofit

output:
  results_dir: "results"

# Optional: pull big-pharma postings from a local pharmajob.io instance
# (a companion project — github.com/s-weissbach/pharmajob.io) instead of
# scraping the same companies again via LinkedIn/Indeed/company_portals.
# Leave enabled: false (or delete this block) if you don't also run that
# project — nothing else in this pipeline changes. Every job, regardless
# of source, still goes through the same AI fit-scoring below.
pharmajob_io:
  enabled: false
  base_url: "http://localhost:8000"
  timeout_seconds: 15
  page_size: 100      # pharmajob.io's GET /jobs caps this at 100 server-side
  max_pages: 5        # per (keyword, location) pair
  # Optional: if pharmajob.io's nightly scraper touches a marker file on
  # successful completion, set its path here and this pipeline will wait
  # (bounded) for it to be from today before querying — safe even if the
  # two schedules land close together. Leave unset to query immediately.
  # freshness_marker: "/path/to/pharmajob.io/.last_scrape_complete"
  freshness_max_wait_minutes: 30
  freshness_poll_seconds: 120

# Direct company portal scraping via Greenhouse/Lever JSON APIs and Workday CXS API.
company_portals:
  fetch_workday_descriptions: false
  fetch_successfactors_descriptions: true

  greenhouse:
    - token: "your-company-token"
      name: "Company Name"

  lever:
    - slug: "your-company-slug"
      name: "Company Name"

  successfactors:
    - base_url: "https://jobs.example.com"
      name: "Company Name"

  workday:
    - name: "Company Name"
      api_url: "https://tenant.wd3.myworkdayjobs.com/wday/cxs/tenant/BoardName/jobs"
